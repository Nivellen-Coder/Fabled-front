<nav class="bg-white border-gray-200 dark:bg-gray-900">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto py-3 px-4">
    <!-- Logo -->
    <a routerLink="home" class="flex items-center space-x-3 rtl:space-x-reverse cursor-pointer">
      <img class="w-[36px] md:w-[48px] lg:w-[48px]" alt="Fabled logo" src="assets/logo/fabled-brand-logo-v2.png">
      <span class="brand self-center px-2 text-sm md:text-2xl lg:text-2xl font-semibold whitespace-nowrap text-gray-900 dark:text-white">FaBled</span>
    </a>

    <!-- Burger menu button (visible only on mobile) -->
    <button (click)="toggleMenu()" type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg xl:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
            aria-controls="navbar-cta" aria-expanded="false">
      <span class="sr-only">Open main menu</span>
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M1 1h15M1 7h15M1 13h15"/>
      </svg>
    </button>

    <!-- Desktop Auth Buttons (right aligned) -->
    <div class="hidden xl:flex xl:order-2 xl:space-x-2 rtl:space-x-reverse" *ngIf="!isLoggedIn">
      <button routerLink="user-register"
              class="flex text-gray-900 dark:text-white bg-transparent focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium text-sm px-2 py-2 text-center dark:focus:ring-blue-800 mx-2 border-b-2 border-transparent hover:border-blue-500 transition duration-300 cursor-pointer">
        <lucide-icon name="file-pen" class="flex flex-wrap mx-1"></lucide-icon>
        <span class="mx-1 my-0.5">Sign Up</span>
      </button>
      <button routerLink="user-login"
              class="flex text-gray-900 dark:text-white bg-transparent focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium text-sm px-4 py-2 text-center dark:focus:ring-blue-800 mx-2 border-b-2 border-transparent hover:border-blue-500 transition duration-300 cursor-pointer">
        <span class="mx-0.5 my-0.5">Sign In</span>
        <lucide-icon name="log-in" class="flex flex-wrap mx-1"></lucide-icon>
      </button>
    </div>

    <div class="hidden xl:flex xl:order-2 xl:space-x-2 rtl:space-x-reverse" *ngIf="isLoggedIn">
      <button routerLink="user-profile"
              class="flex text-gray-900 dark:text-white bg-transparent focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium text-sm px-2 py-2 text-center dark:focus:ring-blue-800 mx-3 border-b-2 border-transparent hover:border-blue-500 transition duration-300 cursor-pointer">
        <lucide-icon name="circle-user-round" class="flex flex-wrap mx-1"></lucide-icon>
        <span class="mr-3 my-0.5">{{isLoggedInUsername}}</span>
      </button>
      <button (click)="logout()"
              class="flex text-gray-900 dark:text-white bg-transparent focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium text-sm px-2 py-2 text-center dark:focus:ring-blue-800 mx-2 border-b-2 border-transparent hover:border-blue-500 transition duration-300 cursor-pointer">
        <span class="mx-0.5 my-0.5">Log out</span>
        <lucide-icon name="log-out" class="flex flex-wrap mx-1"></lucide-icon>
      </button>
    </div>

    <!-- Main menu: links + mobile auth buttons -->
    <div class="w-full xl:flex xl:w-auto xl:order-1" [ngClass]="{'hidden': !menuOpen, 'flex': menuOpen}" id="navbar-cta">
      <ul
        class="flex flex-col font-medium p-4 xl:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 xl:space-x-8 xl:flex-row xl:mt-0 xl:border-0 xl:bg-white md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 xl:dark:bg-gray-900 dark:border-gray-700 w-full">
        <li>
          <a routerLink="home"
             routerLinkActive="text-blue-700 dark:text-blue-500 font-semibold border-b-2 border-blue-500"
             [routerLinkActiveOptions]="{ exact: true }"
             class="flex text-black dark:text-white rounded lg:bg-transparent">
            <lucide-icon name="house" class="flex flex-wrap mx-0.5 my-0.5"></lucide-icon>
            <span class="mx-1 my-1">Home</span>
          </a>
        </li>
        <li>
          <a routerLink="card-list"
             routerLinkActive="text-blue-700 dark:text-blue-500 font-semibold border-b-2 border-blue-500"
             [routerLinkActiveOptions]="{ exact: true }"
             class="flex text-black dark:text-white rounded lg:bg-transparent">
            <lucide-icon name="square-mouse-pointer" class="flex flex-wrap mx-0.5 my-0.5"></lucide-icon>
            <span class="mx-1 my-1">Browse cards</span>
          </a>
        </li>
        <li>
          <a routerLink="seller-guide"
             routerLinkActive="text-blue-700 dark:text-blue-500 font-semibold border-b-2 border-blue-500"
             [routerLinkActiveOptions]="{ exact: true }"
             class="flex text-black dark:text-white rounded lg:bg-transparent">
            <lucide-icon name="gem" class="flex flex-wrap mx-0.5 my-0.5"></lucide-icon>
            <span class="mx-1 my-1">Seller's Guide</span>
          </a>
        </li>
        <li>
          <a routerLink="about-us"
             routerLinkActive="text-blue-700 dark:text-blue-500 font-semibold border-b-2 border-blue-500"
             [routerLinkActiveOptions]="{ exact: true }"
             class="flex text-black dark:text-white rounded lg:bg-transparent">
            <lucide-icon name="users-round" class="flex flex-wrap mx-0.5 my-0.5"></lucide-icon>
            <span class="mx-1 my-1">About us</span>
          </a>
        </li>
        <li>
          <a routerLink="contact"
             routerLinkActive="text-blue-700 dark:text-blue-500 font-semibold border-b-2 border-blue-500"
             [routerLinkActiveOptions]="{ exact: true }"
             class="flex text-black dark:text-white rounded lg:bg-transparent">
            <lucide-icon name="contact-round" class="flex flex-wrap mx-0.5 my-0.5"></lucide-icon>
            <span class="mx-1 my-1">Contact</span>
          </a>
        </li>

        <!-- Mobile-only auth buttons -->
        <ng-container *ngIf="!isLoggedIn">
          <li class="xl:hidden">
            <a routerLink="user-register"
               class="flex text-gray-900 dark:text-white text-sm px-1 py-1 font-medium">
              <lucide-icon name="file-pen"></lucide-icon><span class="mx-2">Sign Up</span>
            </a>
          </li>
          <li class="xl:hidden">
            <a routerLink="user-login"
               class="flex text-gray-900 dark:text-white text-sm px-1 py-1 font-medium">
              <lucide-icon name="log-in"></lucide-icon><span class="mx-2">Sign In</span>
            </a>
          </li>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <li class="xl:hidden">
            <a routerLink="user-profile"
               class="flex text-gray-900 dark:text-white text-sm px-1 py-1 font-medium">
              <lucide-icon name="circle-user-round"></lucide-icon><span class="mx-2">{{isLoggedInUsername}}</span>
            </a>
          </li>
          <li class="xl:hidden">
            <button (click)="logout()" class="flex text-gray-900 dark:text-white text-sm px-1 py-1 font-medium">
              <lucide-icon name="log-out"></lucide-icon><span class="mx-2">Log out</span>
            </button>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
