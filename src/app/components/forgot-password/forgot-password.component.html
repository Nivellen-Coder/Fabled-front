<div class="max-w-md mx-auto my-32 p-6 bg-white dark:bg-gray-900 rounded-2xl shadow-lg">
  <h2 class="text-2xl font-semibold text-center mb-6 text-black dark:text-white">Forgotten Password</h2>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
      />
    </div>

    <button
      type="submit"
      class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
    >
      Send link
    </button>
  </form>

  <p *ngIf="message" class="text-green-600 mt-4 text-center">{{ message }}</p>
  <p *ngIf="error" class="text-red-600 mt-4 text-center">{{ error }}</p>
</div>
