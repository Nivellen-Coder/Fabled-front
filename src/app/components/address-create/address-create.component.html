<div class="w-full bg-yellow-200 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 px-4 py-3 text-center text-sm font-medium shadow-md mb-4">
  ⚠️ This project is a <strong>demo only</strong>. Fabled is not a real marketplace and is intended for demonstration purposes only.
</div>
<div class="max-w-4xl mx-auto my-8 p-8 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-lg shadow-lg">
  <h1 class="text-3xl font-bold mb-6 text-center">{{ username }}'s Address Create</h1>

  <form [formGroup]="addressForm" (ngSubmit)="createAddress()" class="space-y-6">

    <!-- Street Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Street</label>
      <input type="text" formControlName="street"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- House Number Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">House Number</label>
      <input type="text" formControlName="houseNumber"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- City Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">City</label>
      <input type="text" formControlName="city"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Region Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Region</label>
      <input type="text" formControlName="region"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Postal Code Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Postal Code</label>
      <input type="text" formControlName="postalCode"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Country Field -->
    <div>
      <label for="country" class="block text-lg font-medium text-gray-700 dark:text-gray-300">Country</label>
      <select id="country"
              name="country"
              formControlName="country"
              class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      >
        <option *ngFor="let country of countries" [ngValue]="country.name">{{ country.name }}</option>
      </select>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button type="submit" class="w-full md:w-auto px-6 py-3 text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 transition disabled:bg-gray-400 disabled:cursor-not-allowed" [disabled]="addressForm.invalid">
        Create Address
      </button>
    </div>

  </form>
</div>
