<div class="max-w-4xl mx-auto my-16 p-8 bg-gray-100 dark:bg-gray-800 rounded-3xl shadow-2xl text-gray-100">
  <h2 class="text-3xl font-extrabold mb-8 text-center text-black dark:text-white">Your Shopping Cart</h2>

  <div *ngIf="items.length; else empty">
    <ul class="space-y-6">
      <li *ngFor="let item of items" class="flex justify-between items-center bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 hover:bg-gray-100 rounded-xl p-4 transition duration-300">
        <div>
          <p class="text-xl font-semibold text-black dark:text-white">{{ item.name }}</p>
          <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">{{ item.price }} € x {{ item.quantity }}</p>
        </div>
        <button
          (click)="removeItem(item.id)"
          class="text-red-400 hover:text-red-300 font-semibold text-sm transition"
        >
          Remove
        </button>
      </li>
    </ul>

    <div class="mt-10 border-t border-gray-600 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-2xl font-bold text-gray-900 dark:text-white">Total: {{ total }} €</p>
      <div class="flex gap-3">
        <button
          (click)="clear()"
          class="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium transition"
        >
          Clear
        </button>
        <button
          (click)="goToCheckout()"
          class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium transition"
        >
          Checkout
        </button>
      </div>
    </div>
  </div>

  <ng-template #empty>
    <div class="text-center py-10 text-gray-400">
      <p class="text-lg">Your shopping cart is empty.</p>
    </div>
  </ng-template>
</div>
