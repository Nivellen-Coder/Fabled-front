<div class="max-w-3xl mx-auto mt-10 p-6 bg-white dark:bg-gray-700 rounded-2xl shadow-lg my-64 text-gray-500 dark:text-white">
  <h2 class="text-2xl font-bold mb-6">Your Shopping Cart</h2>

  <div *ngIf="items.length; else empty">
    <ul class="divide-y divide-gray-200">
      <li *ngFor="let item of items" class="py-4 flex justify-between items-center">
        <div>
          <p class="text-lg font-medium text-gray-800 dark:text-gray-100">{{ item.name }}</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">{{ item.price }} € x {{ item.quantity }}</p>
        </div>
        <button
          (click)="removeItem(item.id)"
          class="text-red-600 hover:text-red-800 text-sm font-semibold"
        >
          Delete
        </button>
      </li>
    </ul>

    <div class="mt-6 flex justify-between items-center">
      <p class="text-xl font-bold">Total : {{ total }} €</p>
      <button
        (click)="clear()"
        class="px-4 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 transition"
      >
        Clear cart
      </button>
    </div>
  </div>

  <ng-template #empty>
    <p class="text-gray-500 text-center">Your shopping cart is empty.</p>
  </ng-template>
</div>
