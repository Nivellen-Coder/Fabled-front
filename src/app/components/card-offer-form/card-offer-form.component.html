<div class="container mx-auto pt-8 dark:bg-gray-800 bg-gray-200 shadow-md mt-8 mb-8 p-6 rounded-lg border-2 border-gray-500 dark:border-white xl:w-1/2">
  <h1 class="register-title mb-6 text-center text-4xl font-extrabold text-blue-500 drop-shadow-lg">Place an Offer</h1>

  <form class="pb-8" [formGroup]="offerForm" (ngSubmit)="onSubmit()">
    <div class="grid gap-6 mb-6 grid-cols-1 p-4 mx-auto xl:w-3/4">

      <!-- Quantity -->
      <div class="mb-6 mx-6">
        <label for="quantity" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Quantity</label>
        <input type="number" min="1" max="99" id="quantity" formControlName="quantity"
               [class.border-red-500]="offerForm.get('quantity')?.invalid && offerForm.get('quantity')?.touched"
               class="bg-gray-50 border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3
                      dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" required>
        <div *ngIf="offerForm.get('quantity')?.invalid && offerForm.get('quantity')?.touched" class="text-sm text-red-600 mt-1">
          Quantity is required and must be between 1 and 99.
        </div>
      </div>

      <!-- Price -->
      <div class="mb-6 mx-6">
        <label for="price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Price (€)</label>
        <input type="number" step="0.01" min="0.01" id="price" formControlName="price"
               [class.border-red-500]="offerForm.get('price')?.invalid && offerForm.get('price')?.touched"
               class="bg-gray-50 border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3
                      dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" required>
        <div *ngIf="offerForm.get('price')?.invalid && offerForm.get('price')?.touched" class="text-sm text-red-600 mt-1">
          Price is required.
        </div>
      </div>

      <!-- Edition Language -->
      <div class="mb-6 mx-6">
        <label for="editionLang" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Edition Language</label>
        <select id="editionLang" formControlName="editionLang"
                [class.border-red-500]="offerForm.get('editionLang')?.invalid && offerForm.get('editionLang')?.touched"
                class="bg-gray-50 border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3
                       dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
          <option value="" disabled>Select a language</option>
          <option value="English">English</option>
          <option value="French">French</option>
          <option value="Italian">Italian</option>
          <option value="German">German</option>
          <option value="Spanish">Spanish</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Japanese">Japanese</option>
        </select>
        <div *ngIf="offerForm.get('editionLang')?.invalid && offerForm.get('editionLang')?.touched" class="text-sm text-red-600 mt-1">
          Language is required.
        </div>
      </div>

      <!-- Card Condition -->
      <div class="mb-6 mx-6">
        <label for="cardCondition" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Card Condition</label>
        <select id="cardCondition" formControlName="cardCondition"
                [class.border-red-500]="offerForm.get('cardCondition')?.invalid && offerForm.get('cardCondition')?.touched"
                class="bg-gray-50 border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3
                       dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
          <option value="" disabled>Select a condition</option>
          <option value="Near Mint">Near Mint</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Lightly Played">Lightly Played</option>
          <option value="Played">Played</option>
          <option value="Heavily Played">Heavily Played</option>
          <option value="Poor">Poor</option>
        </select>
        <div *ngIf="offerForm.get('cardCondition')?.invalid && offerForm.get('cardCondition')?.touched" class="text-sm text-red-600 mt-1">
          Condition is required.
        </div>
      </div>

      <!-- Foil -->
      <div class="mx-6">
        <div class="flex items-center mb-6">
          <input id="isFoil" type="checkbox" formControlName="isFoil"
                 class="w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500
                        dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
          <label for="isFoil" class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Foil</label>
        </div>
      </div>

      <!-- Description -->
      <div class="mb-6 mx-6">
        <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
        <textarea id="description" formControlName="description" rows="4"
                  [class.border-red-500]="offerForm.get('description')?.invalid && offerForm.get('description')?.touched"
                  class="bg-gray-50 border text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-3
                         dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                  required></textarea>
        <div *ngIf="offerForm.get('description')?.invalid && offerForm.get('description')?.touched" class="text-sm text-red-600 mt-1">
          Description is required.
        </div>
      </div>

      <!-- Submit Button -->
      <div class="flex items-center justify-center mb-6">
        <button type="submit"
                class="w-1/2 text-white bg-blue-500 hover:bg-blue-600 focus:ring-4 focus:outline-none focus:ring-blue-300
                       dark:bg-blue-600 dark:hover:bg-blue-500 dark:focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-3 text-center"
                [disabled]="offerForm.invalid">
          Place an Offer
        </button>
      </div>

    </div>
  </form>
</div>
