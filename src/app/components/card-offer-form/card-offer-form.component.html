<div class="container mx-auto pt-8 dark:bg-gray-800 bg-gray-200 shadow-md mt-8 mb-8 p-6 rounded border-double border-gray-500 dark:border-white border-2">
  <h1 class="register-title mb-4 text-center text-4xl font-extrabold text-gray-900 drop-shadow-lg"><span style="color: #3498db;">Place an offer for {{ cardId }}</span></h1>
    <form class="pb-8" [formGroup]="offerForm" (ngSubmit)="onSubmit()">
      <div class="grid gap-6 mb-6 grid-cols-1 p-4 mx-4">
        <div class="mb-6 mx-6">
          <label for="quantity" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Quantity</label>
          <input type="number"
                 min="1"
                 max="99"
                 id="quantity"
                 formControlName="quantity"
                 class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                 required>
        </div>
        <div class="mb-6 mx-6">
          <label for="price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Price</label>
          <input type="number"
                 step="0.01"
                 min="0.01"
                 id="price"
                 class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                 formControlName="price"
                 required>
        </div>
        <div class="mb-6 mx-6">
          <label for="editionLang" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Edition Language</label>
          <select id="editionLang" formControlName="editionLang" class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="Italian">Italian</option>
          </select>
        </div>
        <div class="mb-6 mx-6">
          <label for="cardCondition" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Card Condition</label>
          <select id="cardCondition" formControlName="cardCondition" class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
            <option value="Near Mint">Near Mint</option>
            <option value="Excellent">Excellent</option>
            <option value="Good">Good</option>
            <option value="Lightly Played">Lightly Played</option>
            <option value="Played">Played</option>
            <option value="Heavily Played">Heavily Played</option>
            <option value="Poor">Poor</option>
          </select>
        </div>
        <div class="mx-6">
          <div class="flex items-center mb-4">
            <input id="isFoil" type="checkbox" formControlName="isFoil" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
            <label for="isFoil" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">Foil</label>
          </div>
        </div>

        <div class="mx-6">
          <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
          <input type="text"
                 id="description"
                 formControlName="description"
                 class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                 required>
        </div>

      <div class="grid mb-6 md:grid-cols-1 p-4 mx-32">
        <button type="submit" class="text-white bg-blue-500 dark:bg-blue-500 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Place an Offer</button>
      </div>
      </div>
    </form>
</div>
