<div class="w-full bg-yellow-200 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 px-4 py-3 text-center text-sm font-medium shadow-md mb-4">
  ⚠️ This project is a <strong>demo only</strong>. Fabled is not a real marketplace and is intended for demonstration purposes only.
</div>
<div class="flex items-center justify-center mt-12 mb-12">
  <div class="bg-white dark:bg-gray-800 p-8 rounded-lg border border-gray-300 dark:border-gray-700 shadow-lg w-[400px]">
    <h2 class="login-title text-center text-3xl font-semibold text-blue-600 mb-6">Sign In</h2>
    <form>
      <!-- Champ Username -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
        <input type="text"
               id="username"
               [(ngModel)]="username"
               name="username"
               class="mt-2 p-3 w-full text-gray-900 dark:text-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
               placeholder="Enter your username"
        >
      </div>

      <!-- Champ Mot de passe -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
        <input type="password"
               id="password"
               [(ngModel)]="password"
               name="password"
               class="mt-2 p-3 w-full text-gray-900 dark:text-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
               placeholder="Enter your password"
        >
      </div>

      <div class="mb-6">
        <a
          routerLink="/forgot-password"
          class="text-sm text-blue-600 hover:underline"
        >
          Forgot your password?
        </a>
      </div>

      <!-- Bouton de Connexion -->
      <div class="flex justify-center">
        <button type="submit"
                (click)="login()"
                class="py-3 px-6 rounded-md text-white bg-blue-500 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          Log In
        </button>
      </div>
    </form>
  </div>
</div>
