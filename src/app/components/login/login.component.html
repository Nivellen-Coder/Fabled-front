<div class="flex items-center justify-center mt-6 mb-[250px] sm:mb-[300px] md:mb-[600px] xl:md:mb-[1000px]">
  <div class="bg-gray-100 dark:bg-gray-800 p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-semibold mb-4">Log In</h2>

    <!-- Formulaire de connexion -->
    <form>
      <!-- Champ Username -->
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" class="mt-1 p-2 w-full border rounded-md dark:bg-gray-700 dark:border-gray-600">
      </div>

      <!-- Champ Mot de passe -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" class="mt-1 p-2 w-full border rounded-md dark:bg-gray-700 dark:border-gray-600">
      </div>

      <!-- Bouton de Connexion -->
      <button type="submit" (click)="login()" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:shadow-outline-blue active:bg-blue-800 dark:bg-blue-700 dark:hover:bg-blue-800">
        Log In
      </button>
    </form>
  </div>
</div>
