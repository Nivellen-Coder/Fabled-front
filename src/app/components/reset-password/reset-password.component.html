<div class="w-full bg-yellow-200 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 px-4 py-3 text-center text-sm font-medium shadow-md mb-4">
  ⚠️ This project is a <strong>demo only</strong>. Fabled is not a real marketplace and is intended for demonstration purposes only.
</div>
<div class="max-w-md mx-auto my-32 p-6 bg-white dark:bg-gray-900 text-black dark:text-white rounded-2xl shadow-lg">
  <h2 class="text-2xl font-semibold text-center mb-6">Change Your Password</h2>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium">New password</label>
      <input
        type="password"
        [(ngModel)]="newPassword"
        name="newPassword"
        required
        class="w-full px-4 py-2 border border-gray-300 dark:bg-gray-800 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
      />
    </div>

    <div>
      <label class="block mb-1 font-medium">Confirm new password</label>
      <input
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        class="w-full px-4 py-2 border border-gray-300 dark:bg-gray-800 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
      />
    </div>

    <button
      type="submit"
      class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
    >
      Change
    </button>
  </form>

  <p *ngIf="message" class="text-green-600 mt-4 text-center">{{ message }}</p>
  <p *ngIf="error" class="text-red-600 mt-4 text-center">{{ error }}</p>
</div>
