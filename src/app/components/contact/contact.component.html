<form
  [formGroup]="contactForm"
  (ngSubmit)="submitForm()"
  class="max-w-xl mx-auto space-y-6 p-6 bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-700 my-12"
>
  <h2 class="text-2xl font-bold dark:text-white text-black text-center">Contact Us</h2>

  <div>
    <label for="name" class="block text-sm dark:text-gray-400 text-gray-600 mb-1">Name</label>
    <input
      id="name"
      formControlName="name"
      type="text"
      placeholder="Enter your name"
      class="w-full px-4 py-2 dark:bg-gray-800 border-gray-200 dark:text-white text-black rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <div>
    <label for="email" class="block text-sm dark:text-gray-400 text-gray-600 mb-1">Email</label>
    <input
      id="email"
      formControlName="email"
      type="email"
      placeholder="Enter your email"
      class="w-full px-4 py-2 dark:bg-gray-800 border-gray-200 dark:text-white text-black rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <div>
    <label for="message" class="block text-sm dark:text-gray-400 text-gray-600 mb-1">Message</label>
    <textarea
      id="message"
      formControlName="message"
      rows="5"
      placeholder="Write your message..."
      class="w-full px-4 py-2 dark:bg-gray-800 border-gray-200 dark:text-white text-black rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"
    ></textarea>
  </div>

  <div class="text-center">
    <button
      type="submit"
      [disabled]="contactForm.invalid"
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg transition duration-200 disabled:opacity-50"
    >
      Send Message
    </button>
  </div>
</form>
