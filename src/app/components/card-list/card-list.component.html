    <div class="grid grid-cols-4 gap-x-6">
      <div *ngFor="let i of divList; let index = index">
        <div role="status" class="flex items-center justify-center h-96 w-72 bg-white-300 rounded-lg animate-pulse my-4" *ngIf="isLoading">
          <svg class="w-36 h-24 text-white-200 " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="gray" viewBox="0 0 16 20">
            <path d="M5 5V.13a2.96 2.96 0 0 0-1.293.749L.879 3.707A2.98 2.98 0 0 0 .13 5H5Z"/>
            <path d="M14.066 0H7v5a2 2 0 0 1-2 2H0v11a1.97 1.97 0 0 0 1.934 2h12.132A1.97 1.97 0 0 0 16 18V2a1.97 1.97 0 0 0-1.934-2ZM9 13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2Zm4 .382a1 1 0 0 1-1.447.894L10 13v-2l1.553-1.276a1 1 0 0 1 1.447.894v2.764Z"/>
          </svg>
          <span class="sr-only">Loading... {{ index + 1 }}</span>
        </div>
      </div>
    </div>
    <div class="mt-2 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-8">
      <div class="group relative cursor-pointer" *ngFor="let card of cards">
        <div class="w-full overflow-hidden rounded-md bg-gray-200 dark:bg-transparent lg:aspect-none group-hover:opacity-75" *ngIf="cards.length">
          <img [src]="card.image" alt="Illustration card for {{ card.name }}" class="h-full w-full object-cover object-center group-hover:opacity-75">
        </div>
        <div class="mt-1 flex justify-between">
          <div>
            <h3 class="text-sm text-gray-700 dark:text-white">
              <a (click)="cardDetail(card.identifier)">
                <span aria-hidden="true" class="absolute inset-0 cursor-pointer"></span>
                {{ card.name }}
              </a>
            </h3>
            <p class="mt-1 text-sm text-gray-500 dark:text-white cursor-pointer">{{ card.rarity }}</p>
          </div>
        </div>
      </div>
    </div>


    <div class="my-16">
      <app-pagination [currentPage]="currentPage" [limit]=pageSize [total]=total [pagesCount]=nbPage (changePage)="changePage($event)" ></app-pagination>
    </div>
  </div>
</div>
