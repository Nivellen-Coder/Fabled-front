<div class="w-full bg-yellow-200 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 px-4 py-3 text-center text-sm font-medium shadow-md mb-4">
  ⚠️ This project is a <strong>demo only</strong>. Fabled is not a real marketplace and is intended for demonstration purposes only.
</div>
<div class="max-w-4xl mx-auto my-8 p-8 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-lg shadow-lg">
  <h1 class="text-3xl font-bold mb-6 text-center">Edit your offer</h1>

  <form [formGroup]="offerEditForm" (ngSubmit)="updateOffer()" class="space-y-6">

    <div class="mb-6 mx-6">
      <label for="quantity" class="block text-lg font-medium text-gray-700 dark:text-gray-300">Quantity</label>
      <input type="number"
             min="1"
             max="99"
             id="quantity"
             formControlName="quantity"
             class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
             required>
    </div>

    <div class="mb-6 mx-6">
      <label for="price" class="block text-lg font-medium text-gray-700 dark:text-gray-300">Price (€)</label>
      <input type="number"
             step="0.01"
             min="0.01"
             id="price"
             class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
             formControlName="price"
             required>
    </div>

    <div class="mb-6 mx-6">
      <label for="editionLang" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Edition Language</label>
      <select id="editionLang" formControlName="editionLang" class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        <option value="English">English</option>
        <option value="French">French</option>
        <option value="Italian">Italian</option>
      </select>
    </div>

    <div class="mb-6 mx-6">
      <label for="cardCondition" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Card Condition</label>
      <select id="cardCondition" formControlName="cardCondition" class="form-control bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" >
        <option value="Near Mint">Near Mint</option>
        <option value="Excellent">Excellent</option>
        <option value="Good">Good</option>
        <option value="Lightly Played">Lightly Played</option>
        <option value="Played">Played</option>
        <option value="Heavily Played">Heavily Played</option>
        <option value="Poor">Poor</option>
      </select>
    </div>

    <div class="mx-6">
      <div class="flex items-center mb-4">
        <input id="isFoil" type="checkbox" formControlName="isFoil" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
        <label for="isFoil" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">Foil</label>
      </div>
    </div>

    <!-- Description -->
    <div class="mb-6 mx-6">
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Description</label>
      <input type="text" formControlName="description"
                required
                class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>


    <!-- Bouton de soumission -->
    <div class="text-center">
      <button type="submit" class="w-full md:w-auto px-6 py-3 text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 transition disabled:bg-gray-400 disabled:cursor-not-allowed" [disabled]="offerEditForm.invalid">
        Update offer
      </button>
    </div>

  </form>
</div>
