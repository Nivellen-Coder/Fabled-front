<div class="max-w-4xl mx-auto my-8 p-8 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-lg shadow-lg">
  <h1 class="text-3xl font-bold mb-6 text-center">{{ username }}'s Profile Update</h1>

  <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="space-y-6">

    <!-- Email Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Email</label>
      <input type="email" formControlName="email"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- FirstName Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">First Name</label>
      <input type="text" formControlName="firstName"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- LastName Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">Last Name</label>
      <input type="text" formControlName="lastName"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Password Field -->
    <div>
      <label class="block text-lg font-medium text-gray-700 dark:text-gray-300">New Password (optional)</label>
      <input type="password" formControlName="password"
             class="w-full px-4 py-2 mt-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button type="submit" class="w-full md:w-auto px-6 py-3 text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 transition disabled:bg-gray-400 disabled:cursor-not-allowed" [disabled]="profileForm.invalid">
        Update Profile
      </button>
    </div>

  </form>
</div>
