<div class="w-full bg-yellow-200 dark:bg-yellow-300 text-yellow-900 dark:text-yellow-950 px-4 py-3 text-center text-sm font-medium shadow-md mb-4">
  ⚠️ This project is a <strong>demo only</strong>. Fabled is not a real marketplace and is intended for demonstration purposes only.
</div>
<div class="max-w-4xl mx-auto my-16 p-8 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-2xl shadow-xl">
  <h1 class="text-3xl font-bold mb-8 text-center">{{ username }}'s Profile</h1>

  <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="space-y-6">

    <!-- Email -->
    <div>
      <label class="block mb-1 text-sm font-medium">Email</label>
      <input
        type="email"
        formControlName="email"
        class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="text-sm text-red-400 mt-1">
        Please enter a valid email.
      </div>
    </div>

    <!-- First Name -->
    <div>
      <label class="block mb-1 text-sm font-medium">First Name</label>
      <input
        type="text"
        formControlName="firstName"
        class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      <div *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched" class="text-sm text-red-400 mt-1">
        First name is required.
      </div>
    </div>

    <!-- Last Name -->
    <div>
      <label class="block mb-1 text-sm font-medium">Last Name</label>
      <input
        type="text"
        formControlName="lastName"
        class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none"
      />
      <div *ngIf="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched" class="text-sm text-red-400 mt-1">
        Last name is required.
      </div>
    </div>

    <!-- Password -->
    <div>
      <label class="block mb-1 text-sm font-medium">New Password (optional)</label>
      <input
        type="password"
        formControlName="password"
        class="w-full px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none"
      />
    </div>

    <!-- Submit -->
    <div class="pt-4 text-center">
      <button
        type="submit"
        [disabled]="profileForm.invalid"
        class="px-6 py-3 w-full md:w-auto rounded-xl text-white font-semibold bg-blue-600 hover:bg-blue-700 transition focus:outline-none focus:ring-4 focus:ring-blue-400 disabled:bg-gray-500 disabled:cursor-not-allowed"
      >
        Update Profile
      </button>
    </div>

  </form>
</div>
