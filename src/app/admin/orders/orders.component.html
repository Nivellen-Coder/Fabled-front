<!-- Search & Filter Section -->
<div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
  <!-- Champ de recherche -->
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="filterOrders()"
    placeholder="Search by username..."
    class="w-full md:w-1/3 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <!-- Filtre par statut -->
  <select
    [(ngModel)]="selectedStatus"
    (change)="filterOrders()"
    class="w-full md:w-1/4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
  >
    <option value="all">All Statuses</option>
    <option *ngFor="let status of uniqueStatuses" [value]="status">
      {{ status | titlecase }}
    </option>
  </select>
</div>

<!-- Orders Table -->
<div class="overflow-x-auto rounded-lg shadow-md">
  <table class="min-w-full text-sm text-left text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-900">
    <thead class="text-xs uppercase bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
    <tr>
      <th class="px-4 py-3">Order #</th>
      <th class="px-4 py-3">User</th>
      <th class="px-4 py-3">Total</th>
      <th class="px-4 py-3">Status</th>
      <th class="px-4 py-3">Date</th>
      <th class="px-4 py-3">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let order of paginatedOrders" class="border-b border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
      <td class="px-4 py-3">{{ order.id }}</td>
      <td class="px-4 py-3">{{ order.user }}</td>
      <td class="px-4 py-3">{{ order.total }} €</td>
      <td class="px-4 py-3">
          <span
            class="inline-block px-2 py-1 text-xs font-semibold rounded-full"
            [ngClass]="{
              'bg-green-100 text-green-700 dark:bg-green-700 dark:text-green-100': order.status === 'paid',
              'bg-yellow-100 text-yellow-700 dark:bg-yellow-700 dark:text-yellow-100': order.status === 'pending',
              'bg-red-100 text-red-700 dark:bg-red-700 dark:text-red-100': order.status === 'cancelled',
              'bg-blue-100 text-blue-700 dark:bg-blue-700 dark:text-blue-100': order.status === 'shipped'
            }"
          >
            {{ order.status | titlecase }}
          </span>
      </td>
      <td class="px-4 py-3">{{ order.createdAt | date: 'short' }}</td>
      <td class="px-4 py-3">
        <button
          class="text-sm text-blue-600 dark:text-blue-400 hover:underline"
          (click)="openOrderDetails(order)"
        >
          View
        </button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- Pagination -->
<div class="flex justify-center mt-6 space-x-2">
  <button
    *ngFor="let page of totalPages"
    (click)="goToPage(page)"
    [ngClass]="{
      'bg-blue-600 text-white': currentPage === page,
      'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 hover:bg-gray-300 dark:hover:bg-gray-600': currentPage !== page
    }"
    class="px-3 py-1 rounded-lg text-sm font-medium transition"
  >
    {{ page }}
  </button>
</div>

<app-order-detail
  [order]="selectedOrder"
  [visible]="isModalOpen"
  (closeModal)="isModalOpen = false"
>

</app-order-detail>
