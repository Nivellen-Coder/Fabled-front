<div
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
  *ngIf="visible"
>
  <div class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 rounded-lg w-full max-w-xl shadow-xl p-6 relative">
    <!-- Close button -->
    <button
      class="absolute top-4 right-4 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-white"
      (click)="close()"
    >
      ✕
    </button>

    <h2 class="text-2xl font-semibold mb-4">Order #{{ order.id }}</h2>

    <div class="space-y-2">
      <p><span class="font-semibold">User:</span> {{ order.user }}</p>
      <p><span class="font-semibold">Total:</span> {{ order.total }} €</p>
      <p><span class="font-semibold">Status:</span> {{ order.status }}</p>
      <p><span class="font-semibold">Date:</span> {{ order.createdAt | date: 'fullDate' }}</p>
    </div>

    <div class="mt-4">
      <h3 class="font-semibold mb-2">Items</h3>
      <ul class="list-disc list-inside">
        <li *ngFor="let item of order.items">
          {{ item.productName }} × {{ item.quantity }} — {{ item.price / 100 }} €
        </li>
      </ul>
    </div>
  </div>
</div>
