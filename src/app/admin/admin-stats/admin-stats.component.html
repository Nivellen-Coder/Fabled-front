<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 p-6">
  <!-- Users -->
  <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-5 flex flex-col gap-4">
    <div class="flex items-center space-x-3">
      <lucide-icon name="users" class="text-blue-500 w-6 h-6"></lucide-icon>
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Users</span>
    </div>
    <div class="text-3xl font-bold text-blue-600 dark:text-blue-400">{{ stats.totalUsers }}</div>
  </div>

  <!-- Cards -->
  <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-5 flex flex-col gap-4">
    <div class="flex items-center space-x-3">
      <lucide-icon name="layers" class="text-purple-500 w-6 h-6"></lucide-icon>
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Offers</span>
    </div>
    <div class="text-3xl font-bold text-purple-600 dark:text-purple-400">{{ stats.totalOffers }}</div>
  </div>

  <!-- Sales -->
  <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-5 flex flex-col gap-4">
    <div class="flex items-center space-x-3">
      <lucide-icon name="shopping-bag" class="text-green-500 w-6 h-6"></lucide-icon>
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Sales Made</span>
    </div>
    <div class="text-3xl font-bold text-green-600 dark:text-green-400">{{ stats.sales }}</div>
  </div>

  <!-- Revenue -->
  <div class="bg-white dark:bg-gray-800 shadow-md rounded-2xl p-5 flex flex-col gap-4">
    <div class="flex items-center space-x-3">
      <lucide-icon name="dollar-sign" class="text-rose-500 w-6 h-6"></lucide-icon>
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Revenue</span>
    </div>
    <div class="text-3xl font-bold text-rose-600 dark:text-rose-400">{{ stats.revenue | currency:'EUR' }}</div>
  </div>
</div>
